<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#202526"><title>Little Realm · The divided realm</title>
<style>body{margin:0;background:#102329;color:#f5edcf;font-family:system-ui,sans-serif}#loading{box-sizing:border-box;margin:20vh auto;padding:24px;width:min(90%,420px);background:#142e35;border:1px solid #bca66b;border-radius:12px}#loading progress{width:100%;accent-color:#d6bb78}#loading button{font:inherit;padding:10px 16px}#loading [hidden]{display:none}</style>
<link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/loading.css"></head><body>
<canvas id="game" aria-label="Little Realm battlefield. Click to move; WASD to walk." tabindex="0"></canvas>
<section id="loading" aria-label="Game loading"><div class="load-heading"><strong id="load-title">Opening Little Realm</strong><span id="load-count"></span></div><progress id="load-progress" aria-label="Essential artwork loading"></progress><p id="load-detail" role="status" aria-live="polite">Preparing the hero selection screen.</p><button id="load-retry" type="button" hidden onclick="location.reload()">Retry loading</button><noscript>This game needs JavaScript enabled to run.</noscript></section>
<div id="ui"></div><script type="module" src="/src/main.js" onerror="document.getElementById('load-title').textContent='Game code could not load';document.getElementById('load-detail').textContent='Check your connection and retry.';document.getElementById('load-retry').hidden=false"></script></body></html>
